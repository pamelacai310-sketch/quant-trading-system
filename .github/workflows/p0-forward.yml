name: P0 frozen forward evidence
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p0-forward-evidence
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check finite experiment window
        id: window
        run: |
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [[ "$today" > "2026-09-05" && "$today" < "2026-09-12" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install capture dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 akshare==1.18.94 flask==3.1.3 scipy==1.17.1
      - name: Capture immutable data and orders
        if: steps.window.outputs.active == 'true'
        id: capture
        continue-on-error: true
        run: python -m quant_trade_system.forward_evidence capture
      - name: Report evidence status
        if: steps.window.outputs.active == 'true'
        run: python -m quant_trade_system.forward_evidence report
      - name: Persist observations and failures
        if: always() && steps.window.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/p0_week_20260907
          if ! git diff --cached --quiet; then
            git commit -m 'Record P0 forward evidence attempt'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.active == 'true'
        with:
          name: p0-evidence-${{ github.run_id }}
          path: experiments/p0_week_20260907
          retention-days: 90
      - name: Surface data failure
        if: steps.capture.outcome == 'failure'
        run: exit 1
