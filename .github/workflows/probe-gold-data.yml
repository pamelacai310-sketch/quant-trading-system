name: Probe historical gold data sources
on:
  push:
    branches: [feat/gold-v35-p0-selling-pressure-20261031]
    paths:
      - '.github/workflows/probe-gold-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install XLSX parser
        run: python -m pip install 'pandas>=2.2,<3' 'openpyxl>=3.1'
      - name: Probe public data sources
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,datetime
          sources={
            "Yahoo GC=F":"https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?period1=1704067200&period2=1793404800&interval=1d",
            "Yahoo DXY":"https://query1.finance.yahoo.com/v8/finance/chart/DX-Y.NYB?period1=1704067200&period2=1793404800&interval=1d",
            "FRED TIPS":"https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFII10&cosd=2024-01-01&coed=2026-10-30",
            "Stooq GC":"https://stooq.com/q/d/l/?s=gc.f&i=d&d1=20240101&d2=20261030",
            "CFTC 2026":"https://www.cftc.gov/files/dea/history/fut_disagg_txt_2026.zip",
            "SINA AU0":"https://stock2.finance.sina.com.cn/futures/api/json.php/IndexService.getInnerFuturesDailyKLine?symbol=AU0",
            "SINA AU2612":"https://stock2.finance.sina.com.cn/futures/api/json.php/IndexService.getInnerFuturesDailyKLine?symbol=AU2612",
            "GLD archive":"https://api.spdrgoldshares.com/api/v1/historical-archive?exchange=NYSE&lang=en&product=gld",
            "Eastmoney markets":"https://futsse-static.eastmoney.com/redis?msgid=gnweb",
            "Eastmoney 113-index":"https://futsse-static.eastmoney.com/redis?msgid=113",
            "Eastmoney 113_1":"https://futsse-static.eastmoney.com/redis?msgid=113_1",
            "Eastmoney 113_2":"https://futsse-static.eastmoney.com/redis?msgid=113_2",
            "Eastmoney 113.AU0":"https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=113.AU0&klt=101&fqt=1&lmt=10000&end=20500000&iscca=1&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64&ut=7eea3edcaed734bea9cbfc24409ed989&forcect=1",
            "Eastmoney 113.AU2612":"https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=113.AU2612&klt=101&fqt=1&lmt=10000&end=20500000&iscca=1&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64&ut=7eea3edcaed734bea9cbfc24409ed989&forcect=1"
          }
          for name,url in sources.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; ResearchDataAudit/1.0)","Accept":"*/*"})
              with urllib.request.urlopen(req,timeout=25) as f:
                body=f.read(25000000)
                print("PROBE",name,"status",f.status,"length",len(body),"type",f.headers.get("content-type"),"prefix",repr(body[:120]))
                if name.startswith("Eastmoney"):
                  try:
                    data=json.loads(body)
                    arr=(data.get("data") or {}).get("klines") or [] if isinstance(data,dict) else []
                    print("EM_PARSED",name,"len",len(arr),"first",arr[0][:110] if arr else None,"last",arr[-1][:110] if arr else None,"marketinfo",str(data)[:100] if not arr else "")
                    if isinstance(data,list):
                      print("EM_MAPPING_SAMPLES",name,"length",len(data),"SHFE_AU",[(x.get("name"),x.get("code"),x.get("vcode"),x.get("mktid")) for x in data if isinstance(x,dict) and ("沪金" in str(x.get("name")) or str(x.get("code","")).upper().startswith("AU"))][:40])
                  except Exception as e: print("EM_ERR",str(e)[:100])
                if name.startswith("SINA"):
                  print("SINA_CONTENT",name,body[:230]); aa=json.loads(body.decode("gbk")); print("SINA_ROWS",name,len(aa) if aa else 0,"FIRST",aa[0] if aa else None,"LAST",aa[-1] if aa else None)
                if name=="GLD archive":
                  try:
                    import io,zipfile
                    z=zipfile.ZipFile(io.BytesIO(body))
                    print("GLD_ZIPFILE_CONTENT",len(z.namelist()),z.namelist()[:8]); import pandas as pd; dfs=pd.read_excel(io.BytesIO(body),sheet_name=None,header=None,nrows=15);print("GLD_SHEETS",list(dfs)); [print("GLD_HEAD",k,str(df.head(12).to_string(index=False,header=False))[:1800]) for k,df in list(dfs.items())[:2]]
                  except Exception as e: print("GLD_PARSE_ERR",str(e)[:150])
                if name=="CFTC 2026":
                  try:
                    import io,zipfile
                    z=zipfile.ZipFile(io.BytesIO(body))
                    print("CFTC_ZIPFILE_CONTENT",z.namelist())
                    print("CFTC_HEADER",z.read(z.namelist()[0])[:1400].split(b'\\n')[0])
                  except Exception as e: print("CFTC_PARSE_ERR",str(e)[:150])
                if name.startswith("Yahoo") and len(body):
                  try:
                    res=json.loads(body)["chart"]["result"][0]
                    arr=res["timestamp"]
                    print("YAHOO_ROWS",name,len(arr),"first",datetime.datetime.fromtimestamp(arr[0],datetime.timezone.utc),"last",datetime.datetime.fromtimestamp(arr[-1],datetime.timezone.utc))
                    q=res["indicators"]["quote"][0];print("YAHOO_LAST_PRICE",q["close"][-1],"YAHOO_2024_FIRST",q["close"][0])
                  except Exception as e:print("YAHOO_PARSE_ERROR",name,type(e).__name__,str(e)[:180])
            except Exception as e: print("PROBE_FAILED",name,type(e).__name__,str(e)[:230])

          try:
            headers={"User-Agent":"Mozilla/5.0 (QuantResearchBot/1.0)"}
            req=urllib.request.Request("https://futsse-static.eastmoney.com/redis?msgid=113",headers=headers)
            with urllib.request.urlopen(req,timeout=20) as resp: marketindex=json.loads(resp.read())
            print("EASTMONEY_MAIN_PAGES",len(marketindex))
            for i in range(1,len(marketindex)+1):
              try:
                req=urllib.request.Request("https://futsse-static.eastmoney.com/redis?msgid=113_"+str(i),headers=headers)
                with urllib.request.urlopen(req,timeout=15) as resp: items=json.loads(resp.read())
                hits=[(x.get("name"),x.get("code"),x.get("vcode"),x.get("linetype")) for x in items if "沪金" in str(x.get("name")) or "黄金" in str(x.get("name")) or str(x.get("code","")).lower().startswith("au")]
                if hits: print("AU_MAIN_MAPPING",i,hits)
              except Exception as e: print("PAGE_ERR",i,str(e)[:90])
          except Exception as e: print("MAIN_MAPPING_ERROR",str(e)[:120])
          PY
