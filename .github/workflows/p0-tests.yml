name: P0 accounting regression
on:
  pull_request:
  push:
    paths:
      - 'quant_trade_system/**'
      - 'tests/**'
      - '.github/workflows/p0-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3 flask==3.1.3 scipy==1.17.1 requests lightgbm==4.7.0 torch==2.14.0
      - run: python -m unittest tests.test_p0_accounting tests.test_forward_evidence tests.test_paper_week tests.test_backtest_adaptive_risk tests.test_robustness_controls -v
